name: SGDK Mega Drive Build (iratahack toolchain)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Checkout
      # ---------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      # Dependências básicas
      # ---------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget unzip openjdk-17-jdk make cmake libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex

      # ---------------------------
      # SGDK
      # ---------------------------
      - name: Download SGDK
        run: |
          git clone https://github.com/Stephane-D/SGDK.git
          echo "SGDK=$PWD/SGDK" >> $GITHUB_ENV

      # ---------------------------
      # Build m68k-elf-gcc (iratahack)
      # ---------------------------
      - name: Build m68k-elf-gcc toolchain
        run: |
          git clone --recursive https://github.com/iratahack/m68k-elf-gcc.git
          cd m68k-elf-gcc
          chmod +x crosstool-build.sh
          ./crosstool-build.sh

          # instala toolchain
          sudo mv m68k-elf /opt/m68k-elf
          echo "/opt/m68k-elf/bin" >> $GITHUB_PATH
          echo "PREFIX=m68k-elf-" >> $GITHUB_ENV

      # ---------------------------
      # Build resources (rescomp)
      # ---------------------------
      - name: Compile resources
        run: |
          java -jar SGDK/bin/rescomp.jar res/resources.res

      # ---------------------------
      # Build ROM
      # ---------------------------
      - name: Build ROM
        run: |
          make -f SGDK/makefile.gen

      # ---------------------------
      # Upload ROM
      # ---------------------------
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: megadrive-rom
          path: out/*.bin