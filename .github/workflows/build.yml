name: SGDK Mega Drive

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2. Dependências base
      # -------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git wget make \
            openjdk-17-jdk \
            gcc-m68k-linux-gnu \
            binutils-m68k-linux-gnu

      # -------------------------
      # 3. SGDK
      # -------------------------
      - name: Clone SGDK
        run: |
          git clone https://github.com/Stephane-D/SGDK.git
          echo "SGDK=$PWD/SGDK" >> $GITHUB_ENV

      # -------------------------
      # 4. Config toolchain (IMPORTANTE)
      # -------------------------
      - name: Setup SGDK toolchain
        run: |
          echo "PREFIX=m68k-linux-gnu-" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      # -------------------------
      # 5. Build resources
      # -------------------------
      - name: Build resources
        run: |
          java -jar SGDK/bin/rescomp.jar res/resources.res

      # -------------------------
      # 6. Build ROM
      # -------------------------
      - name: Build ROM
        run: |
          make -f SGDK/makefile.gen PREFIX=m68k-linux-gnu-

      # -------------------------
      # 7. Preparar release
      # -------------------------
      - name: Prepare release
        run: |
          mkdir -p release
          cp out/*.bin release/rom.bin

      # -------------------------
      # 8. Criar RELEASE (DOWNLOAD BOTÃO)
      # -------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SGDK Build ${{ github.run_number }}
          files: release/rom.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
