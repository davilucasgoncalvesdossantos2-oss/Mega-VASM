name: SGDK Build (with iratahack toolchain)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # =========================
    # DEPENDÊNCIAS
    # =========================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential git wget texinfo \
          bison flex libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
          python3 unzip

    # =========================
    # SGDK
    # =========================
    - name: Clone SGDK
      run: |
        git clone https://github.com/Stephane-D/SGDK.git
        cd SGDK
        export GDK=$PWD
        make -f makelib.gen

    # =========================
    # TOOLCHAIN (iratahack)
    # =========================
    - name: Clone m68k toolchain
      run: |
        git clone --recursive https://github.com/iratahack/m68k-elf-gcc.git

    - name: Build toolchain
      working-directory: m68k-elf-gcc
      run: |
        chmod +x crosstool-build.sh
        ./crosstool-build.sh

    # =========================
    # FIX CRÍTICO PATH
    # =========================
    - name: Setup PATH correctly
      run: |
        echo "$GITHUB_WORKSPACE/m68k-elf-gcc/m68k-elf/bin" >> $GITHUB_PATH
        echo "GDK=$GITHUB_WORKSPACE/SGDK" >> $GITHUB_ENV

    # =========================
    # TESTE DO COMPILADOR
    # =========================
    - name: Verify toolchain
      run: |
        ls m68k-elf-gcc/m68k-elf/bin || true
        m68k-elf-gcc --version

    # =========================
    # BUILD ROM (SGDK)
    # =========================
    - name: Build ROM
      run: |
        export GDK=$GITHUB_WORKSPACE/SGDK
        export PATH=$PATH:$GITHUB_WORKSPACE/m68k-elf-gcc/m68k-elf/bin
        make

    # =========================
    # ARTIFACT
    # =========================
    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: rom
        path: out/*.bin
