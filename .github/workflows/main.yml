name: Build m68k-elf-gcc (iratahack)

on:
  workflow_dispatch:
  push:

jobs:
  build-toolchain:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          git \
          wget \
          texinfo \
          bison \
          flex \
          libgmp-dev \
          libmpfr-dev \
          libmpc-dev \
          libisl-dev \
          python3 \
          unzip

    - name: Clone iratahack toolchain
      run: |
        git clone --recursive https://github.com/iratahack/m68k-elf-gcc.git

    - name: Build toolchain
      working-directory: m68k-elf-gcc
      run: |
        chmod +x crosstool-build.sh
        ./crosstool-build.sh

    - name: Add toolchain to PATH
      run: |
        echo "$GITHUB_WORKSPACE/m68k-elf-gcc/m68k-elf/bin" >> $GITHUB_PATH

    - name: Test compiler
      run: |
        m68k-elf-gcc --version

    - name: Package toolchain
      run: |
        cd m68k-elf-gcc
        tar -czf m68k-elf-toolchain-linux.tar.gz m68k-elf

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: m68k-elf-toolchain
        path: m68k-elf-gcc/m68k-elf-toolchain-linux.tar.gz
