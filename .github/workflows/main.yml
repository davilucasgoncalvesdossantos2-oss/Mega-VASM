name: SGDK Build (Cloud)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential openjdk-17-jdk make wget

      - name: Clone SGDK
        run: |
          git clone https://github.com/Stephane-D/SGDK.git SGDK

      - name: Setup SGDK environment
        run: |
          echo "GDK=$GITHUB_WORKSPACE/SGDK" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/SGDK/bin" >> $GITHUB_PATH

      - name: Check SGDK tools
        run: |
          ls SGDK/bin || true
          which m68k-elf-gcc || echo "gcc not found (expected if not bundled)"

      - name: Build ROM
        run: |
          make -f SGDK/makefile.gen

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: sgdk-rom
          path: |
            *.bin
            out/release/*.bin
